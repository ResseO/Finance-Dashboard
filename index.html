<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Finance Command</title>
    
    <!-- iOS Native PWA Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Command">
    
    <script src="https://tailwindcss.com"></script>
    <style>
        body {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            -webkit-tap-highlight-color: transparent;
        }
        /* Smooth scale animation on button presses */
        .active-press:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body class="bg-[#05070B] text-gray-100 font-sans min-h-screen flex flex-col justify-between selection:bg-emerald-500/30">

    <!-- Premium App Header -->
    <header class="px-6 pt-6 pb-4 border-b border-gray-900 bg-[#090D16]/80 backdrop-blur sticky top-0 z-50 flex justify-between items-center">
        <div>
            <h1 class="text-lg font-bold tracking-tight bg-gradient-to-r from-emerald-400 to-teal-400 bg-clip-text text-transparent">Finance Command</h1>
            <p class="text-3xs text-gray-400 uppercase tracking-widest font-semibold mt-0.5" id="liveDate">September 2026 Tracker</p>
        </div>
        <div class="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></div>
    </header>

    <!-- Main Content Stream -->
    <main class="flex-1 px-4 py-6 space-y-5 overflow-y-auto max-w-md mx-auto w-full">
        
        <!-- Hero Dynamic Remainder Dashboard -->
        <div class="bg-gradient-to-b from-[#111827] to-[#0F172A] border border-gray-800 rounded-2xl p-5 shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-emerald-500/5 rounded-full blur-2xl pointer-events-none"></div>
            
            <span class="block text-3xs font-bold text-gray-400 uppercase tracking-wider mb-1">Net Disposable Remainder</span>
            <div class="text-3xl font-black tracking-tight text-white transition-all duration-300" id="netRemainder font-mono">\$0.00</div>
            
            <div class="mt-4 grid grid-cols-2 gap-4 border-t border-gray-800/60 pt-3 text-xs">
                <div>
                    <span class="block text-3xs text-gray-500 uppercase font-semibold">Total Net Income</span>
                    <span class="font-bold text-emerald-400 text-sm" id="summaryPaycheck">\$0.00</span>
                </div>
                <div>
                    <span class="block text-3xs text-gray-500 uppercase font-semibold">Total Expenses</span>
                    <span class="font-bold text-rose-400 text-sm" id="summaryBills">\$0.00</span>
                </div>
            </div>
        </div>

        <!-- Configuration Section: Income -->
        <div class="bg-[#0D1321] border border-gray-900 rounded-2xl p-4 shadow-xl space-y-3">
            <div class="flex items-center space-x-2">
                <span class="text-sm">💵</span>
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Income Adjustments</h3>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-3xs text-gray-500 mb-1 font-medium">Paycheck Amount</label>
                    <input type="number" id="paycheckInput" oninput="saveData()" placeholder="0.00" class="w-full bg-[#05070B] border border-gray-800 focus:border-emerald-500 rounded-xl px-3 py-2.5 text-white focus:outline-none text-sm font-semibold transition-all">
                </div>
                <div>
                    <label class="block text-3xs text-gray-500 mb-1 font-medium">Pay Cycle</label>
                    <select id="paycheckFreq" onchange="saveData()" class="w-full bg-[#05070B] border border-gray-800 focus:border-emerald-500 rounded-xl px-3 py-2.5 text-white focus:outline-none text-sm font-semibold transition-all h-[42px]">
                        <option value="biweekly">Biweekly (Est. Monthly)</option>
                        <option value="monthly">Monthly Flat</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Configuration Section: Bills Ledger -->
        <div class="bg-[#0D1321] border border-gray-900 rounded-2xl p-4 shadow-xl space-y-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <span class="text-sm">💳</span>
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Bills & Obligations</h3>
                </div>
                <button onclick="addBillRow()" class="active-press bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 text-3xs font-bold px-3 py-1.5 rounded-xl transition border border-emerald-500/20 uppercase tracking-wider">
                    + Add Obligation
                </button>
            </div>
            
            <!-- Injected Cards -->
            <div id="billsContainer" class="space-y-3">
                <!-- Dynamically populated via JS -->
            </div>
        </div>

    </main>

    <!-- Native App Footnote -->
    <footer class="bg-[#05070B] border-t border-gray-900/60 px-6 py-4 text-center text-gray-600 text-3xs tracking-widest font-semibold uppercase">
        🔐 LOCAL DATA ONLY • ZERO SERVERS
    </footer>

    <script>
        // Core state architecture
        let financialData = {
            paycheck: 11000,
            frequency: 'biweekly',
            bills: [
                { name: 'SECU Visa Card', amount: 1500, dueDate: 15 },
                { name: 'Housing & Expenses', amount: 1845, dueDate: 1 }
            ]
        };

        // Initialize App UI and parse Date
        function initApp() {
            const dateObj = new Date();
            document.getElementById('liveDate').innerText = dateObj.toLocaleDateString(undefined, { month: 'long', year: 'numeric' }) + " Track";

            const cachedData = localStorage.getItem('masterFinanceDataPremium');
            if (cachedData) {
                financialData = JSON.parse(cachedData);
            }
            
            document.getElementById('paycheckInput').value = financialData.paycheck || '';
            document.getElementById('paycheckFreq').value = financialData.frequency || 'biweekly';
            
            renderBills();
            calculateSummary();
        }

        // Generate clean modular elements with real-time countdown calculations
        function renderBills() {
            const container = document.getElementById('billsContainer');
            container.innerHTML = '';

            const today = new Date();
            const currentDay = today.getDate();

            financialData.bills.forEach((bill, index) => {
                // Compute countdown arithmetic
                let daysRemaining = bill.dueDate - currentDay;
                let countdownText = "";
                let badgeClass = "bg-gray-900 text-gray-400";

                if (daysRemaining === 0) {
                    countdownText = "⚠️ Due Today";
                    badgeClass = "bg-amber-500/10 text-amber-400 border border-amber-500/20 font-bold";
                } else if (daysRemaining === 1) {
                    countdownText = "⏳ Due Tomorrow";
                    badgeClass = "bg-orange-500/10 text-orange-400 border border-orange-500/20";
                } else if (daysRemaining > 1) {
                    countdownText = `⏳ In ${daysRemaining} days`;
                    badgeClass = daysRemaining <= 5 ? "bg-amber-500/5 text-amber-300" : "bg-gray-900/80 text-gray-400";
                } else {
                    // Passed this month, calculate for next month cycle
                    const nextMonth = new Date(today.getFullYear(), today.getMonth() + 1, bill.dueDate);
                    const timeDiff = nextMonth.getTime() - today.getTime();
                    const diffDays = Math.ceil(timeDiff / (1000 * 3600 * 24));
                    countdownText = `⏳ In ${diffDays} days`;
                    badgeClass = "bg-gray-900/40 text-gray-500";
                }

                const card = document.createElement('div');
                card.className = "bg-[#090D16] border border-gray-900/60 rounded-xl p-3.5 space-y-3 shadow-inner";
                card.innerHTML = `
                    <div class="flex justify-between items-center">
                        <input type="text" value="${bill.name}" oninput="updateBillAsset(${index}, 'name', this.value)" placeholder="Label" class="bg-transparent font-bold text-sm text-white focus:outline-none w-2/3 border-b border-transparent focus:border-gray-800">
                        <div class="flex items-center space-x-2">
                            <span class="text-3xs px-2 py-0.5 rounded-md ${badgeClass}">${countdownText}</span>
                            <button onclick="removeBillRow(${index})" class="text-rose-500/70 hover:text-rose-400 text-3xs font-bold uppercase tracking-wider pl-1">Del</button>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-4xs text-gray-500 uppercase font-bold tracking-wider mb-1">Balance Due</label>
                            <input type="number" value="${bill.amount || ''}" oninput="updateBillAsset(${index}, 'amount', this.value)" placeholder="\$ 0.00" class="w-full bg-[#05070B] border border-gray-850 rounded-lg px-2.5 py-2 text-xs text-white font-semibold focus:outline-none focus:border-emerald-500 font-mono">
                        </div>
                        <div>
